services:
  dev:
    build:
      context: .
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: cachyos-dev:latest
    hostname: cachyos-dev
    working_dir: /workspace
    tty: true
    stdin_open: true
    command: fish

    # Rootless podman: map your host UID to the container user so files in the
    # bind mount are owned by you on both sides. (Ignored by Docker.)
    userns_mode: keep-id

    environment:
      TERM: ${TERM:-xterm-kitty}
      COLORTERM: truecolor
      XDG_RUNTIME_DIR: /run/user/${USER_UID:-1000}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-1}

    # IPv6 disabled inside the container
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
      net.ipv6.conf.default.disable_ipv6: "1"

    # Forwarded ports (host:container). Bound to localhost only; drop the
    # "127.0.0.1:" prefix to expose them on your LAN.
    # Dev servers inside must listen on 0.0.0.0, not just localhost.
    ports:
      - "127.0.0.1:2999:2999"
      - "127.0.0.1:3000:3000"

    volumes:
      # Your project. Set PROJECT_DIR in the shell or a .env file.
      # :Z relabels for SELinux (needed on Fedora etc.; harmless elsewhere).
      - ${PROJECT_DIR:-.}:/workspace:Z

      # Git identity from your machine, both files set by run-container. Without
      # them the placeholder is mounted instead, i.e. no git settings at all.
      #   .gitconfig.host = your host config ($GIT_CONFIG_HOST: aliases, pager, ...)
      #   .gitconfig      = generated ($GIT_IDENTITY_FILE): includes the host config
      #                     and pins user.name/user.email resolved for PROJECT_DIR
      #                     on the host, so includeIf "gitdir:..." rules apply too.
      # Both are read-only: edit your config on the host, and use
      # `git config --local` for repo-specific settings inside the container.
      - ${GIT_CONFIG_HOST:-./gitconfig.placeholder}:/home/dev/.gitconfig.host:ro,Z
      - ${GIT_IDENTITY_FILE:-./gitconfig.placeholder}:/home/dev/.gitconfig:ro,Z

      # Persist caches and editor state across container recreations
      - nvim-data:/home/dev/.local/share/nvim
      - nvim-state:/home/dev/.local/state/nvim
      - cargo-registry:/home/dev/.cargo/registry
      - cargo-git:/home/dev/.cargo/git
      - go-pkg:/home/dev/go/pkg
      - npm-global:/home/dev/.npm-global
      - cache:/home/dev/.cache
      - pi-data:/home/dev/.pi
      - vibe-data:/home/dev/.vibe
      - ${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY:-wayland-1}:/run/user/1000/${WAYLAND_DISPLAY:-wayland-1}
      # Optional: ssh agent
      # - ${SSH_AUTH_SOCK}:/ssh-agent:Z
      #   (and add SSH_AUTH_SOCK: /ssh-agent under environment)
      # Optional: signed commits / credentials, if your host git config uses them
      # - ${HOME}/.gnupg:/home/dev/.gnupg:ro,Z
      # - ${HOME}/.git-credentials:/home/dev/.git-credentials:ro,Z

volumes:
  nvim-data:
  nvim-state:
  cargo-registry:
  cargo-git:
  go-pkg:
  npm-global:
  cache:
  pi-data:
  vibe-data:
